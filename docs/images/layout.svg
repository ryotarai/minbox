<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The minbox screen: sessions, terminal, inbox</title>
  <defs>
    <style>
      .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; fill: #8a8a95; }
      .row { font-size: 13px; fill: #ededf0; }
      .sub { font-size: 11px; fill: #9a9aa5; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
    </style>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="14" fill="#16161a"/>
  <!-- title bar -->
  <rect x="0" y="0" width="880" height="34" rx="14" fill="#202026"/>
  <rect x="0" y="20" width="880" height="14" fill="#202026"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="38" cy="17" r="5.5" fill="#febc2e"/><circle cx="56" cy="17" r="5.5" fill="#28c840"/>
  <text x="440" y="21" text-anchor="middle" class="sub">http://127.0.0.1:4848</text>

  <!-- sessions -->
  <rect x="12" y="46" width="208" height="322" rx="10" fill="#1c1c21" stroke="#2c2c33"/>
  <text x="28" y="70" class="label">SESSIONS</text>
  <rect x="20" y="82" width="192" height="50" rx="8" fill="#2a2a31"/>
  <circle cx="34" cy="100" r="4.5" fill="#f2b14a"/>
  <text x="46" y="104" class="row">fix-login</text>
  <text x="46" y="122" class="sub">Waiting on you · 1 question</text>
  <circle cx="34" cy="152" r="4.5" fill="#6fd6a0"/>
  <text x="46" y="156" class="row">add-search</text>
  <text x="46" y="174" class="sub">Working · Add full-text search</text>
  <circle cx="34" cy="204" r="4.5" fill="none" stroke="#6b6b75" stroke-width="1.5"/>
  <text x="46" y="208" class="row">refactor-db</text>
  <text x="46" y="226" class="sub">Quiet</text>
  <circle cx="34" cy="256" r="4.5" fill="none" stroke="#82aefc" stroke-width="1.5"/>
  <text x="46" y="260" class="row">shell</text>
  <text x="46" y="278" class="sub">Shell</text>
  <rect x="20" y="330" width="192" height="28" rx="7" fill="none" stroke="#3a3a42"/>
  <text x="116" y="348" text-anchor="middle" class="row" font-size="12">+ New</text>

  <!-- terminal -->
  <rect x="228" y="46" width="384" height="322" rx="10" fill="#0e0e11" stroke="#2c2c33"/>
  <text x="244" y="70" class="label">TERMINAL · fix-login</text>
  <g class="mono">
    <text x="244" y="102" fill="#a9c7ff">❯ <tspan fill="#d4d4d8">fix the login redirect loop</tspan></text>
    <text x="244" y="130" fill="#d4d4d8">⏺ Read internal/auth/session.go</text>
    <text x="244" y="150" fill="#d4d4d8">⏺ Found it: the cookie is set for /app,</text>
    <text x="258" y="168" fill="#d4d4d8">the redirect goes to /.</text>
    <text x="244" y="196" fill="#f2b14a">⏺ minbox - send_message</text>
    <text x="258" y="214" fill="#9a9aa5">Sent to the minbox inbox asking</text>
    <text x="258" y="232" fill="#9a9aa5">1 question (Started thread thr_7).</text>
    <text x="244" y="270" fill="#d4d4d8">✻ Waiting for your answer…</text>
  </g>
  <line x1="244" y1="320" x2="596" y2="320" stroke="#3a3a42"/>
  <text x="244" y="344" class="mono" fill="#d4d4d8">❯ <tspan fill="#f2b14a">▍</tspan></text>

  <!-- inbox -->
  <rect x="620" y="46" width="248" height="322" rx="10" fill="#1c1c21" stroke="#2c2c33"/>
  <text x="636" y="70" class="label">INBOX</text>
  <text x="636" y="98" class="row" font-weight="600">Redirect fix: which way?</text>
  <text x="636" y="116" class="sub">from Claude · just now</text>
  <rect x="632" y="130" width="224" height="150" rx="9" fill="#24242a" stroke="#f2b14a" stroke-opacity=".55"/>
  <text x="646" y="154" class="row" font-size="12" font-weight="600">Where should the cookie live?</text>
  <circle cx="653" cy="184" r="6" fill="none" stroke="#f2b14a" stroke-width="1.5"/>
  <circle cx="653" cy="184" r="3" fill="#f2b14a"/>
  <text x="667" y="188" class="row" font-size="12">Path=/ (simplest)</text>
  <circle cx="653" cy="212" r="6" fill="none" stroke="#6b6b75" stroke-width="1.5"/>
  <text x="667" y="216" class="row" font-size="12">Redirect to /app</text>
  <circle cx="653" cy="240" r="6" fill="none" stroke="#6b6b75" stroke-width="1.5"/>
  <text x="667" y="244" class="row" font-size="12">Other…</text>
  <rect x="632" y="296" width="224" height="30" rx="7" fill="#24242a" stroke="#3a3a42"/>
  <text x="644" y="315" class="sub">Reply…</text>
  <rect x="772" y="334" width="84" height="26" rx="7" fill="#f2b14a"/>
  <text x="814" y="351" text-anchor="middle" font-size="12" font-weight="650" fill="#1a1a1f">Send ⌘↵</text>
</svg>
