# Builds minbox for macOS and Linux (arm64, amd64) when a version tag (v*) is pushed and publishes
# the archives and checksums.txt as a GitHub Release. Tags with a "-" (v1.2.0-rc.1) become prereleases.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci installs exactly the lockfile (whose versions are vetted to be older than 72 hours, see
      # CLAUDE.md); no dependency needs an install script on Linux, so none runs.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build the archives
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-build.sh "$TAG" dist/release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${flags[@]}"
